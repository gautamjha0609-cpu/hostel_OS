# Sarvlekh on Cloudflare Workers (static assets + one API Worker + nightly cron).
# Build:   npm run build        (stamps the cache version, copies the allowlisted files into dist/)
# Deploy:  npm run deploy       (production)  |  npm run deploy:staging
# Secrets (never in this file):  wrangler secret put SUPABASE_SERVICE_ROLE_KEY  (and the others in ENVIRONMENT_VARIABLES.md)
name = "hostelos"
main = "workers/entry.mjs"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

# The app lives here. hostel.sarvlekh.in stays on Vercel until it is switched over (see the cutover note at the end).
routes = [{ pattern = "rahomate.sarvlekh.in", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
# Static files are served by Cloudflare itself (free, unlimited). Only these paths wake the Worker.
run_worker_first = ["/api/*", "/h/*", "/health"]

[triggers]
# Enable at domain cutover (and remove the cron from vercel.json), so the nightly sweep never runs twice:
crons = []   # was: ["30 21 * * *"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "HostelOS"

[observability]
enabled = true

[env.staging]
routes = []   # staging has no custom domain (routes are otherwise inherited from the top level)
name = "hostelos-staging"

[env.staging.triggers]
crons = []   # staging shares the live database: no nightly sweep from here

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME = "HostelOS"

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/h/*", "/health"]

# Per-IP abuse guard for /api/* (Cloudflare Rate Limiting binding; limits are per location)
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60

[[env.staging.ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
  [env.staging.ratelimits.simple]
  limit = 120
  period = 60

# --- DOMAIN CUTOVER (uncomment ONLY after sarvlekh.in is Active in Cloudflare, then run `npm run deploy`) ---
# routes = [{ pattern = "hostel.sarvlekh.in", custom_domain = true }]
# and set [triggers] crons = ["30 21 * * *"] above; remove "crons" from vercel.json in the same change.
