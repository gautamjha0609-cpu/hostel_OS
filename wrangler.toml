# Sarvlekh on Cloudflare Workers (static assets + one API Worker + nightly cron).
# Build:   npm run build        (stamps the cache version, copies the allowlisted files into dist/)
# Deploy:  npm run deploy       (production)  |  npm run deploy:staging
# Secrets (never in this file):  wrangler secret put SUPABASE_SERVICE_ROLE_KEY  (and the others in ENVIRONMENT_VARIABLES.md)
name = "hostelos"
main = "workers/entry.mjs"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# Static files are served by Cloudflare itself (free, unlimited). Only these paths wake the Worker.
run_worker_first = ["/api/*", "/h/*", "/health"]

[triggers]
crons = ["30 21 * * *"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "HostelOS"

[observability]
enabled = true

[env.staging]
name = "hostelos-staging"

[env.staging.triggers]
crons = []   # staging shares the live database: no nightly sweep from here

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME = "HostelOS"

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/h/*", "/health"]
